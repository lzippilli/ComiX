name: build

# Builds and tests on every supported platform. The library targets net8.0 and net10.0, so both
# runtimes are installed; the test suite runs against both.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet restore ComiX.slnx

      - run: dotnet build ComiX.slnx --no-restore --configuration Release

      - run: dotnet test ComiX.slnx --no-build --configuration Release

      # Compares the packed assembly against the most recently published version, so a break in
      # binary compatibility is reported on the push that introduces it rather than at release.
      # One platform is enough; the result does not vary by operating system.
      - name: Resolve the package validation baseline
        if: matrix.os == 'ubuntu-latest'
        run: |
          latest=$(curl -sf https://api.nuget.org/v3-flatcontainer/comix/index.json | jq -r '.versions[]' | tail -n 1 || true)
          if [ -n "$latest" ]; then
            echo "BASELINE=-p:PackageValidationBaselineVersion=$latest" >> "$GITHUB_ENV"
            echo "Validating API compatibility against $latest"
          else
            echo "No published version yet; package validation runs without a baseline."
          fi

      # Not --no-build: the baseline package is downloaded during restore, which --no-build skips,
      # leaving the validation silently doing nothing.
      - name: Validate package compatibility
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/ComiX/ComiX.csproj --configuration Release $BASELINE
