name: publish

# Publishes the package to nuget.org through Trusted Publishing. No long-lived API key is stored:
# the job obtains a one-hour key by OIDC, which nuget.org issues only to this workflow file in this
# repository, as registered in the trusted publishing policy.
#
# Triggered by pushing a version tag whose name matches the package version, for example
# v1.0.0-preview.1. The tag and the <Version> in ComiX.csproj must agree, or the job fails before
# anything is published.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # create the GitHub release and attach the package
      packages: write   # publish to the GitHub Packages NuGet registry
      id-token: write   # obtain the OIDC token exchanged for the nuget.org key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify that the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/ComiX/ComiX.csproj)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi

      # The CHANGELOG section for the version becomes the release notes on GitHub and on nuget.org.
      # A missing or empty section fails the job before anything is built or published.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/ComiX/ComiX.csproj)
          awk -v heading="## [$version]" '
            /^## \[/ { if (found) exit; found = (index($0, heading) == 1); next }
            found { print }
          ' CHANGELOG.md | sed -e '1{/^$/d}' -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for version $version."
            exit 1
          fi
          echo "Release notes for $version:"
          cat release-notes.md

      - run: dotnet restore ComiX.slnx

      - run: dotnet build ComiX.slnx --no-restore --configuration Release

      - run: dotnet test ComiX.slnx --no-build --configuration Release

      # The baseline is the most recently published version, resolved at run time so that no
      # version has to be maintained in the project file. Packing fails on a breaking change.
      - name: Resolve the package validation baseline
        run: |
          latest=$(curl -sf https://api.nuget.org/v3-flatcontainer/comix/index.json | jq -r '.versions[]' | tail -n 1 || true)
          if [ -n "$latest" ]; then
            echo "BASELINE=-p:PackageValidationBaselineVersion=$latest" >> "$GITHUB_ENV"
            echo "Validating API compatibility against $latest"
          else
            echo "No published version yet; package validation runs without a baseline."
          fi

      - run: dotnet pack src/ComiX/ComiX.csproj --no-build --configuration Release --output artifacts -p:ContinuousIntegrationBuild=true $BASELINE

      # Requested immediately before the push: the temporary key is valid for one hour.
      - name: Obtain a temporary NuGet API key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push the package to nuget.org
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # GitHub Packages mirrors the package under the repository's Packages panel. Its NuGet
      # registry requires an authenticated feed even for public packages, so nuget.org remains the
      # distribution channel for consumers.
      - name: Push the package to GitHub Packages
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate

      # A release per version tag, with the CHANGELOG section as its notes and the package files
      # attached. Versions carrying a pre-release suffix are marked as pre-releases.
      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $prerelease
